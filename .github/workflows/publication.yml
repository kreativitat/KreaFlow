name: Public source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    name: Publication and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check publication boundary
        run: |
          python3 tests/test_publication_guard.py
          python3 tools/check_publication.py
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          directory="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$directory"
          cd "$directory"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o "$archive"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" -o checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$archive" gitleaks
      - name: Scan all public history
        run: '"${RUNNER_TEMP}/gitleaks/gitleaks" git --log-opts="--all --full-history" --redact --ignore-gitleaks-allow --max-archive-depth=2 --no-banner'
  php:
    name: PHP syntax and configuration
    runs-on: ubuntu-latest
    container: php:8.1-cli
    defaults:
      run:
        working-directory: dolibarr/htdocs/custom/kreaflow
    steps:
      - name: Check out Dolibarr test sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Dolibarr/dolibarr
          ref: 7e927764767343334aaa067ca5ec054cfea0a26b # 24.0.2
          path: dolibarr
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dolibarr/htdocs/custom/kreaflow
          persist-credentials: false
      - name: Parse PHP sources
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Verify public configuration and synthetic financial regressions
        run: |
          php tests/run_public_configuration_tests.php
          php tests/run_forecast_calculation_tests.php
          php tests/run_kitchen_tests.php
          php test/invoice_precision_test.php
          php test/paid_invoice_cancellation_test.php
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci --ignore-scripts
      - run: npm --prefix app run build
